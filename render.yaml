services:
  - type: web
    name: saude-perto-de-voce
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start -- --ip 0.0.0.0 --port $PORT --persist-to /tmp/saude-perto-de-voce
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: WRANGLER_SEND_METRICS
        value: "false"
